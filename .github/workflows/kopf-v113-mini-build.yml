name: Kopf an Kopf V1.1.3 installierbare Voll-App

on:
  push:
    branches:
      - "tmp/kopf-v113-builder"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v113:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Buildstand auschecken
        uses: actions/checkout@v4

      - name: V1.1.3-Quellcode wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/v113mini.tar.xz.b64.* \
            | base64 --decode \
            > /tmp/v113mini.tar.xz
          echo 'abb21b9ab09771d0a626a730e13a4d7cc88457e7cb86ef75adf90ac46e79d3d6  /tmp/v113mini.tar.xz' \
            | sha256sum -c -
          mkdir app-source
          tar -xJf /tmp/v113mini.tar.xz -C app-source
          sed -i '/setMaximumWidth/d' \
            app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Version und Funktionen prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'de.smw365.games.kopfankopf.v113'" app-source/app/build.gradle
          grep -F 'versionCode 113' app-source/app/build.gradle
          grep -F "versionName '1.1.3'" app-source/app/build.gradle
          grep -F 'TextToSpeech' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java
          grep -F 'VORLESEN' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java
          grep -F 'Geburtsdatum' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java
          grep -F 'Elternbestätigung' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java
          grep -F 'registration' /dev/null || true
          grep -F 'ANFÄNGER' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java
          grep -F 'EXTREM' app-source/app/src/main/java/de/smw365/games/kopfankopf/v113/MainActivity.java

      - name: Android-Lint und signierte APK bauen
        working-directory: app-source
        run: |
          gradle :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: APK technisch prüfen
        shell: bash
        run: |
          set -euo pipefail
          APK='app-source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" > /tmp/unzip-check.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" \
            | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | tee /tmp/aapt.txt
          grep -F "package: name='de.smw365.games.kopfankopf.v113'" /tmp/aapt.txt
          grep -F "versionCode='113'" /tmp/aapt.txt
          grep -F "versionName='1.1.3'" /tmp/aapt.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

      - name: Endgültige APK bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-output
          cp app-source/app/build/outputs/apk/debug/app-debug.apk \
            release-output/Kopf-an-Kopf-v1.1.3-EINFACH-INSTALLIEREN.apk
          cp /tmp/apksigner.txt release-output/APKSIGNER-PRUEFBERICHT-1.1.3.txt
          cp /tmp/aapt.txt release-output/APK-PAKETPRUEFUNG-1.1.3.txt
          sha256sum release-output/* > release-output/SHA256SUMS-1.1.3.txt

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kopf-an-Kopf-v1.1.3-EINFACH-INSTALLIEREN
          path: release-output/
          if-no-files-found: error
          retention-days: 1
